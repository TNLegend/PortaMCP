[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portamcp"
version = "0.6.0"
description = "Client-neutral Windows and Linux computer control over Model Context Protocol, managed from a desktop control center"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "TNLegend" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "automation", "windows", "linux", "desktop-control"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp>=2.1.1,<2.2",
  "uvicorn>=0.30",
  "websockets>=13",
  "customtkinter>=5.2.2",
  "starlette>=0.37",
  "httpx>=0.27",
  "psutil>=6.0",
  "mss>=10.0",
  "pyautogui>=0.9.54",
  "pillow>=10.0",
  "playwright>=1.50",
  "python3-xlib>=0.15; sys_platform == 'linux'",
  "pywinauto>=0.6.9; sys_platform == 'win32'",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/TNLegend/PortaMCP"
Repository = "https://github.com/TNLegend/PortaMCP"
Issues = "https://github.com/TNLegend/PortaMCP/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
portamcp = "porta_mcp.server:main"
portamcp-local = "porta_mcp.local_http_server:main"
portamcp-http = "porta_mcp.http_server:main"
portamcp-oauth = "porta_mcp.oauth_server:main"
portamcp-ui = "porta_mcp.control_center:main"

[tool.setuptools.packages.find]
include = ["porta_mcp*"]

[tool.ruff]
extend-exclude = [".portamcp", ".venv", ".venv-linux", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
